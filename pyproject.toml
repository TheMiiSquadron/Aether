[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-runtime"
version = "0.1.0"
description = "Aether Foundation runtime scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.scripts]
aether = "aether.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.aether.scripts]
test = "python -m unittest discover -s tests"
run = "python -m aether"
